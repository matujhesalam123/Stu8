    <script>
        // ... existing code ...
        let booksMasterData = [
            { id: "B101", title: "NCERT हिन्दी (क्षितिज)", sub: "401", targetClass: "10th", session: "2025-26", isLocked: false },
            { id: "B102", title: "NCERT अंग्रेजी (First Flight)", sub: "411", targetClass: "10th", session: "2025-26", isLocked: false },
            { id: "B103", title: "NCERT गणित", sub: "100", targetClass: "10th", session: "2025-26", isLocked: false },
            { id: "B104", title: "NCERT विज्ञान", sub: "200", targetClass: "10th", session: "2025-26", isLocked: false },

            { id: "B107", title: "NCERT हिन्दी (कृतिका)", sub: "401", targetClass: "9th", session: "2025-26", isLocked: false },
            { id: "B108", title: "NCERT अंग्रेजी (Beehive)", sub: "411", targetClass: "9th", session: "2025-26", isLocked: false },

            { id: "B112", title: "NCERT हिन्दी (आरोह)", sub: "051", targetClass: "11th", session: "2025-26", isLocked: false },
            { id: "B117", title: "NCERT हिन्दी (आरोह भाग 2)", sub: "051", targetClass: "12th", session: "2025-26", isLocked: false }
        ];

        /* ==========================================================================
           SECTION 3: THEORY & PRACTICAL MARKS CONFIG STATE & LOGIC
           ========================================================================== */
        let marksConfigSettingsStore = {};

        function getMarksConfigRecordKey(targetClass, session, examType, subCode) {
            return `${targetClass}_${session}_${examType}_${subCode}`;
        }

        function renderMarksConfig() {
            const container = document.getElementById("marksConfigContainer");
            if (!container) return;

            const cls = document.getElementById("marksConfigClassSelect") ? document.getElementById("marksConfigClassSelect").value : "ALL";
            const session = document.getElementById("marksConfigSessionSelect") ? document.getElementById("marksConfigSessionSelect").value : "ALL";
            const examType = document.getElementById("marksConfigExamSelect") ? document.getElementById("marksConfigExamSelect").value : "annual";
            const q = (document.getElementById("marksConfigSearchInput") ? document.getElementById("marksConfigSearchInput").value : "").toLowerCase().trim();
            const sortBy = document.getElementById("marksConfigSortSelect") ? document.getElementById("marksConfigSortSelect").value : "codeAsc";

            // Filter subjects directly from Subject Master
            let filteredSubjects = subjectMasterData.filter(s => {
                if (cls !== "ALL" && s.targetClass !== cls) return false;
                if (session !== "ALL" && s.session !== session) return false;
                if (q && !`${s.name} ${s.code}`.toLowerCase().includes(q)) return false;
                return true;
            });

            // Sorting Logic
            filteredSubjects.sort((a, b) => {
                if (sortBy === "nameAsc") return (a.name || "").localeCompare(b.name || "");
                return (a.code || "").localeCompare(b.code || "", undefined, { numeric: true });
            });

            if (filteredSubjects.length === 0) {
                container.innerHTML = `<div class="p-8 text-center text-slate-500 font-bold bg-white text-base">चयनित कक्षा, सत्र व खोज हेतु कोई विषय उपलब्ध नहीं है। कृपया विषय मास्टर से नया विषय जोड़ें।</div>`;
                return;
            }

            const examLabels = {
                "annual": "वार्षिक परीक्षा (Annual)",
                "preboard": "प्री-बोर्ड परीक्षा (Pre-Board)",
                "halfYearly": "अर्द्धवार्षिक परीक्षा (Half-Yearly)",
                "quarterly": "त्रैमासिक परीक्षा (Quarterly)",
                "monthly_july": "मासिक टेस्ट - जुलाई",
                "monthly_august": "मासिक टेस्ट - अगस्त",
                "monthly_september": "मासिक टेस्ट - सितम्बर",
                "monthly_october": "मासिक टेस्ट - अक्टूबर",
                "monthly_november": "मासिक टेस्ट - नवम्बर",
                "monthly_december": "मासिक टेस्ट - दिसम्बर",
                "monthly_january": "मासिक टेस्ट - जनवरी",
                "monthly_february": "मासिक टेस्ट - फरवरी"
            };

            container.innerHTML = `
                <table class="w-full text-xs sm:text-sm border-collapse text-left font-semibold">
                    <thead class="bg-emerald-950 text-white font-bold uppercase whitespace-nowrap">
                        <tr>
                            <th class="p-3 border border-emerald-900 text-center w-12">सुरक्षा</th>
                            <th class="p-3 border border-emerald-900 text-center w-24">विषय कोड</th>
                            <th class="p-3 border border-emerald-900">विषय का नाम</th>
                            <th class="p-3 border border-emerald-900 text-center">कक्षा & सत्र</th>
                            <th class="p-3 border border-emerald-900 text-center">मूल्यांकन प्रकार (Mode)</th>
                            <th class="p-3 border border-emerald-900 text-center text-amber-300">थ्योरी Max</th>
                            <th class="p-3 border border-emerald-900 text-center text-amber-200">थ्योरी Pass</th>
                            <th class="p-3 border border-emerald-900 text-center text-sky-300">प्रैक्टिकल Max</th>
                            <th class="p-3 border border-emerald-900 text-center text-sky-200">प्रैक्टिकल Pass</th>
                            <th class="p-3 border border-emerald-900 text-center no-print w-28">कार्रवाई</th>
                        </tr>
                    </thead>
                    <tbody class="divide-y divide-slate-200 bg-white whitespace-nowrap">
                        ${filteredSubjects.map((s, idx) => {
                            const recKey = getMarksConfigRecordKey(s.targetClass, s.session, examType, s.code);
                            if (!marksConfigSettingsStore[recKey]) {
                                marksConfigSettingsStore[recKey] = {
                                    evalMode: "BOTH", // "BOTH", "THEORY_ONLY", "PRAC_ONLY"
                                    thMax: examType.startsWith("monthly") ? 20 : 75,
                                    thPass: examType.startsWith("monthly") ? 7 : 25,
                                    prMax: examType.startsWith("monthly") ? 5 : 25,
                                    prPass: examType.startsWith("monthly") ? 2 : 8,
                                    isLocked: false
                                };
                            }

                            const cfg = marksConfigSettingsStore[recKey];
                            const isTheoryDisabled = cfg.evalMode === "PRAC_ONLY";
                            const isPracDisabled = cfg.evalMode === "THEORY_ONLY";

                            return `
                                <tr class="hover:bg-emerald-50/50 transition ${cfg.isLocked ? 'bg-slate-50' : ''}">
                                    <td class="p-2.5 border text-center">
                                        <button onclick="toggleMarksConfigLock('${recKey}')" title="${cfg.isLocked ? 'अनलॉक करें' : 'लॉक करें'}" class="p-1 rounded transition ${cfg.isLocked ? 'bg-emerald-700 text-white' : 'bg-slate-200 text-slate-700 hover:bg-slate-300'}">
                                            <i data-lucide="${cfg.isLocked ? 'lock' : 'unlock'}" class="w-3.5 h-3.5"></i>
                                        </button>
                                    </td>
                                    <td class="p-2.5 border text-center font-mono font-black text-emerald-950 text-base bg-emerald-50/40">${s.code}</td>
                                    <td class="p-2.5 border font-extrabold text-slate-900 text-base">${s.name}</td>
                                    <td class="p-2.5 border text-center font-black text-indigo-950">${s.targetClass} <span class="text-xs text-slate-500 font-normal">(${s.session})</span></td>
                                    <td class="p-2.5 border text-center">
                                        <select ${cfg.isLocked ? 'disabled' : ''} onchange="updateMarksConfigField('${recKey}', 'evalMode', this.value)" class="border rounded-lg px-2 py-1 font-bold text-xs bg-white text-indigo-950 border-indigo-300">
                                            <option value="BOTH" ${cfg.evalMode === 'BOTH' ? 'selected' : ''}>थ्योरी + प्रैक्टिकल</option>
                                            <option value="THEORY_ONLY" ${cfg.evalMode === 'THEORY_ONLY' ? 'selected' : ''}>सिर्फ थ्योरी (Only Theory)</option>
                                            <option value="PRAC_ONLY" ${cfg.evalMode === 'PRAC_ONLY' ? 'selected' : ''}>सिर्फ प्रैक्टिकल (Only Practical)</option>
                                        </select>
                                    </td>
                                    <td class="p-2 border text-center">
                                        <input type="number" ${isTheoryDisabled || cfg.isLocked ? 'disabled' : ''} value="${isTheoryDisabled ? 0 : cfg.thMax}" oninput="updateMarksConfigField('${recKey}', 'thMax', this.value)" class="w-16 border rounded-lg text-center font-bold p-1 bg-white">
                                    </td>
                                    <td class="p-2 border text-center">
                                        <input type="number" ${isTheoryDisabled || cfg.isLocked ? 'disabled' : ''} value="${isTheoryDisabled ? 0 : cfg.thPass}" oninput="updateMarksConfigField('${recKey}', 'thPass', this.value)" class="w-16 border rounded-lg text-center font-bold p-1 bg-white">
                                    </td>
                                    <td class="p-2 border text-center">
                                        <input type="number" ${isPracDisabled || cfg.isLocked ? 'disabled' : ''} value="${isPracDisabled ? 0 : cfg.prMax}" oninput="updateMarksConfigField('${recKey}', 'prMax', this.value)" class="w-16 border rounded-lg text-center font-bold p-1 bg-white">
                                    </td>
                                    <td class="p-2 border text-center">
                                        <input type="number" ${isPracDisabled || cfg.isLocked ? 'disabled' : ''} value="${isPracDisabled ? 0 : cfg.prPass}" oninput="updateMarksConfigField('${recKey}', 'prPass', this.value)" class="w-16 border rounded-lg text-center font-bold p-1 bg-white">
                                    </td>
                                    <td class="p-2.5 border text-center no-print">
                                        <div class="flex items-center justify-center space-x-1">
                                            <button onclick="openSubjectModal('${s.id}')" class="bg-purple-700 hover:bg-purple-800 text-white px-2 py-1 rounded-lg text-xs font-bold shadow">
                                                विषय सम्पादित
                                            </button>
                                        </div>
                                    </td>
                                </tr>
                            `;
                        }).join('')}
                    </tbody>
                </table>
            `;

            if (window.lucide) lucide.createIcons();
        }

        function updateMarksConfigField(recKey, field, val) {
            if (!marksConfigSettingsStore[recKey]) return;
            if (field === 'evalMode') {
                marksConfigSettingsStore[recKey].evalMode = val;
            } else {
                marksConfigSettingsStore[recKey][field] = parseFloat(val) || 0;
            }
            renderMarksConfig();
        }

        function toggleMarksConfigLock(recKey) {
            if (marksConfigSettingsStore[recKey]) {
                marksConfigSettingsStore[recKey].isLocked = !marksConfigSettingsStore[recKey].isLocked;
                renderMarksConfig();
                showToast(marksConfigSettingsStore[recKey].isLocked ? "सेटिंग्स सुरक्षित व लॉक हो गईं (🔒)!" : "सेटिंग्स अनलॉक की गईं (🔓)!");
            }
        }

        function bulkToggleMarksConfigLock(state) {
            Object.keys(marksConfigSettingsStore).forEach(k => {
                marksConfigSettingsStore[k].isLocked = state;
            });
            renderMarksConfig();
            showToast(state ? "समस्त थ्योरी/प्रैक्टिकल सेटिंग्स लॉक हो गईं!" : "समस्त सेटिंग्स अनलॉक हो गईं!");
        }

        function saveAllMarksConfigSettings() {
            showToast("समस्त परीक्षा थ्योरी व प्रैक्टिकल अंक सेटिंग्स सुरक्षित कर दी गईं!");
        }

        // Section 3 Export Handlers
        function exportMarksConfigPrint() { window.print(); }

        function exportMarksConfigPDF() {
            showToast("थ्योरी/प्रैक्टिकल सेटिंग्स PDF तैयार हो रही है...");
            const { jsPDF } = window.jspdf;
            const doc = new jsPDF('p', 'pt', 'a4');
            const target = document.getElementById("marksConfigContainer");
            html2canvas(target, { scale: 1.5 }).then(canvas => {
                const imgData = canvas.toDataURL('image/png');
                doc.addImage(imgData, 'PNG', 20, 20, 555, (canvas.height * 555) / canvas.width);
                doc.save(`Theory_Practical_Marks_Config.pdf`);
            });
        }

        function exportMarksConfigExcel() {
            const cls = document.getElementById("marksConfigClassSelect") ? document.getElementById("marksConfigClassSelect").value : "ALL";
            const examType = document.getElementById("marksConfigExamSelect") ? document.getElementById("marksConfigExamSelect").value : "annual";

            const data = subjectMasterData.filter(s => cls === "ALL" || s.targetClass === cls).map(s => {
                const recKey = getMarksConfigRecordKey(s.targetClass, s.session, examType, s.code);
                const cfg = marksConfigSettingsStore[recKey] || { evalMode: "BOTH", thMax: 75, thPass: 25, prMax: 25, prPass: 8 };
                return {
                    "Subject Code": s.code,
                    "Subject Name": s.name,
                    "Class": s.targetClass,
                    "Session": s.session,
                    "Exam Level": examType,
                    "Evaluation Mode": cfg.evalMode,
                    "Theory Max": cfg.thMax,
                    "Theory Pass": cfg.thPass,
                    "Practical Max": cfg.prMax,
                    "Practical Pass": cfg.prPass
                };
            });

            const ws = XLSX.utils.json_to_sheet(data);
            const wb = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(wb, ws, "MarksConfig");
            XLSX.writeFile(wb, "Theory_Practical_Settings.xlsx");
            showToast("Excel शीट्स डाउनलोड हो गईं!");
        }

        function exportMarksConfigDoc() {
            const content = document.getElementById("marksConfigContainer").innerText;
            const blob = new Blob(['\ufeff' + content], { type: 'application/msword' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `Theory_Practical_Settings.doc`;
            a.click();
            showToast("Word Doc फ़ाइल डाउनलोड हो गई!");
        }

        function exportMarksConfigImage() {
            const target = document.getElementById("marksConfigContainer");
            html2canvas(target).then(canvas => {
                const a = document.createElement('a');
                a.href = canvas.toDataURL('image/png');
                a.download = `Theory_Practical_Settings.png`;
                a.click();
                showToast("इमेज डाउनलोड हो गई!");
            });
        }

        /* ==========================================================================
           SECTIONS 4 TO 8 RENDERERS
           ========================================================================== */
// ... existing code ...
`
