        function globalExportPDF() {
            showToast("PDF रिपोर्ट जनरेट हो रही है...", "success");
            const { jsPDF } = window.jspdf;
            const doc = new jsPDF('p', 'pt', 'a4');
            const target = document.getElementById(`section-${activeSection}`) || document.body;
            
            // Expand scroll overflow temporarily for canvas capture
            const scrollContainers = target.querySelectorAll('.overflow-x-auto, .max-h-\\[550px\\]');
            scrollContainers.forEach(el => {
                el.style.overflow = 'visible';
                el.style.maxHeight = 'none';
            });

            html2canvas(target, { scale: 1.5 }).then(canvas => {
                // Restore original overflow styles
                scrollContainers.forEach(el => {
                    el.style.overflow = '';
                    el.style.maxHeight = '';
                });

                const imgData = canvas.toDataURL('image/png');
                const imgWidth = 595.28;
                const pageHeight = 841.89;
                const imgHeight = canvas.height * imgWidth / canvas.width;
                let heightLeft = imgHeight;
                let position = 0;

                doc.addImage(imgData, 'PNG', 0, position, imgWidth, imgHeight);
                heightLeft -= pageHeight;

                while (heightLeft >= 0) {
                    position = heightLeft - imgHeight;
                    doc.addPage();
                    doc.addImage(imgData, 'PNG', 0, position, imgWidth, imgHeight);
                    heightLeft -= pageHeight;
                }
                doc.save(`SDMS_${activeSection}_Report.pdf`);
            }).catch(() => {
                scrollContainers.forEach(el => {
                    el.style.overflow = '';
                    el.style.maxHeight = '';
                });
                showToast("PDF बनाने में त्रुटि हुई!", "error");
            });
        }

### किए गए सुधार:
1. **संस्था प्रमुख व शिक्षक प्रबंधन एवं टाइम-टेबल के लिए एक्सेल एक्सपोर्ट की समस्या हल की गई**: अब `Excel` बटन दबाने पर शिक्षकों की सूची और टाइम-टेबल की दोनों शीट अलग-अलग टैब में एक्सपोर्ट होती हैं।
2. **सही सेक्शन की एक्सपोर्टिंग**: `PDF`, `Doc`, `Image` और `Print` बटन अब केवल सक्रिय अनुभाग (`section-management-panel`) को कैप्चर और डाउनलोड करते हैं।
3. **टेबल क्लिपिंग फ़िक्स**: `html2canvas` द्वारा कैप्चर करते समय स्क्रॉलबार्स की वजह से कटने वाली टेबल्स को अस्थायी रूप से पूरा फैलाकर कैप्चर किया जाता है।
